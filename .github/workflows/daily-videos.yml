name: Generate and publish daily learning videos
on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: Number of videos to render
        required: false
        default: '4'
permissions:
  contents: write
concurrency:
  group: daily-video-publishing
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video and speech dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pillow
      - name: Render narrated vertical videos and publish manifest
        env:
          VIDEO_COUNT: ${{ inputs.count || '4' }}
        run: python scripts/render_videos.py --limit "$VIDEO_COUNT"
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/ content/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily narrated learning videos"
            git push
          fi
