name: Deploy VisualLearn AI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify app source
        run: |
          test -s index.html
          grep -q "VisualLearn AI" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live website
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error --max-time 20 "$PAGE_URL" -o /tmp/visuallearn-live.html && grep -q "VisualLearn AI" /tmp/visuallearn-live.html; then
              echo "Verified live page at $PAGE_URL"
              exit 0
            fi
            echo "Site not ready, retry $attempt/12"
            sleep 10
          done
          echo "Live deployment verification failed"
          exit 1
