<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#090d18;color:#edf2ff;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;background:#9ef5ce;color:#09231b;padding:11px 15px;font-weight:750}button:hover{filter:brightness(1.08)}button:disabled{opacity:.5;cursor:not-allowed}.ghost{background:#222b42;color:#dce8ff}.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 280px;min-height:100vh;max-width:1550px;margin:auto}.side{border-right:1px solid #242c40;padding:28px 18px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:850;letter-spacing:-.7px;margin-bottom:32px}.brand span{color:#9ef5ce}.nav{display:block;width:100%;text-align:left;background:transparent;color:#a8b7d2;margin:5px 0;padding:13px;border-radius:12px}.nav.active,.nav:hover{background:#1b263a;color:#fff}.main{padding:28px clamp(16px,4vw,50px);min-width:0}.rail{border-left:1px solid #242c40;padding:28px 18px;position:sticky;top:0;height:100vh;overflow:auto}.eyebrow{color:#9ef5ce;font-size:11px;font-weight:850;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(30px,4vw,48px);letter-spacing:-1.7px;margin:9px 0}h2{font-size:22px;letter-spacing:-.5px}h3{margin:8px 0 12px}p{color:#aab7ce;line-height:1.65}.muted{color:#91a1ba;font-size:13px}.panel{background:#121a2b;border:1px solid #28334a;border-radius:19px;padding:22px;margin:17px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.chip{font-size:12px;padding:6px 10px;border-radius:999px;background:#24324b;color:#b7d6ef}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#161f32;border:1px solid #29354d;padding:15px;border-radius:14px}.stat strong{font-size:25px;display:block;margin-top:8px}.feed{max-width:760px}.post{margin:20px 0;background:#141d30;border:1px solid #2a3750;border-radius:20px;overflow:hidden}.post-head{padding:20px 22px 4px}.post-body{padding:0 22px 22px}.post h2{font-size:27px;margin:11px 0}.visual{background:radial-gradient(circle at 30% 10%,#253c53,#101a2c 70%);padding:25px 14px;min-height:190px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;border-top:1px solid #293950;border-bottom:1px solid #293950}.node{border:1px solid #6d91ae;background:#1b2e43;color:#e9f7ff;border-radius:13px;padding:17px 13px;min-width:90px;text-align:center;font-weight:700}.arrow{color:#9ef5ce;font-size:22px}.callout{background:#1b2940;border-left:3px solid #9ef5ce;padding:13px 15px;border-radius:7px;color:#d5e3f7;margin:16px 0}.options{display:grid;gap:9px;margin:12px 0}.option{background:#222e46;color:#e5efff;text-align:left}.option.good{background:#215d48}.option.bad{background:#633042}.bar{height:8px;background:#2b3852;border-radius:10px;overflow:hidden}.bar>span{height:100%;display:block;background:#9ef5ce}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0}.tab{white-space:nowrap;background:#1c2940;color:#c5d6ed}.tab.active{background:#9ef5ce;color:#09231b}.hide{display:none!important}input,select,textarea{background:#0d1525;border:1px solid #35415b;border-radius:11px;color:#edf2ff;padding:12px;width:100%}label{display:block;color:#b8c6db;font-size:13px;margin:13px 0 6px}.small{font-size:12px}.lesson-action{margin-top:15px}.divider{border-top:1px solid #2a3750;margin:20px 0}.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.empty{padding:35px;text-align:center}.toast{position:fixed;bottom:20px;right:20px;background:#244936;color:white;padding:12px 20px;border-radius:12px;z-index:9}@media(max-width:1150px){.shell{grid-template-columns:190px minmax(0,1fr)}.rail{display:none}}@media(max-width:680px){.shell{display:block}.side{position:sticky;z-index:5;top:0;height:auto;background:#0b1020;padding:12px 15px;border-right:0;border-bottom:1px solid #28334a;display:flex;align-items:center;gap:9px;overflow:auto}.brand{font-size:16px;margin:0;white-space:nowrap}.nav{width:auto;white-space:nowrap;font-size:12px;padding:9px}.main{padding:20px 15px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat strong{font-size:19px}.post h2{font-size:23px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">◈ VisualLearn <span>AI</span></div><button class="nav active" data-view="feed">◉ For You</button><button class="nav" data-view="paths">▦ Learning Paths</button><button class="nav" data-view="saved">◇ Saved</button><button class="nav" data-view="settings">⚙ Settings</button></aside><main class="main"><div id="app"></div></main><aside class="rail"><div class="eyebrow">Your career operating system</div><h2>Daily momentum</h2><div id="rail-stats"></div><div class="divider"></div><h3>Today's mix</h3><p class="muted">System design · AI engineering · Software engineering · Interview prep</p><div class="divider"></div><p class="muted">AI generates new content locally when your browser supports WebGPU. The built-in curriculum always works without an API key.</p></aside></div><div id="toast" class="toast hide"></div>
<script type="module">
const TRACKS=[{id:'system',name:'System Design',color:'#a6c8ff'},{id:'ai',name:'AI Engineering',color:'#b8f7d1'},{id:'software',name:'Software Engineering',color:'#e9c2ff'},{id:'interview',name:'Interview Prep',color:'#ffdc9d'}];
const TOPICS={
system:[['Load balancing','Distribute requests across healthy application instances.',['Client','Load Balancer','App A / App B'],'A load balancer improves availability and spreads traffic, but session state and health checks still matter.','What helps remove unhealthy servers?',['Health checks','More CSS','Longer URLs'],0],['Caching strategies','Use caches to reduce repeated expensive reads.',['Request','Redis Cache','Database'],'Cache-aside reads the cache first, loads misses from the database, then populates the cache. Plan for invalidation and TTLs.','What is a common cache risk?',['Stale data','More HTML','Fewer CPUs'],0],['Database sharding','Partition data across database nodes.',['Shard Key','Shard 1','Shard 2'],'Choose a shard key that distributes load. Hot partitions and cross-shard queries create complexity.','What makes a poor shard key?',['Uneven distribution','High cardinality','Stable routing'],0],['Message queues','Decouple producers from background consumers.',['API','Queue','Worker'],'Queues buffer bursts and enable retries. Consumers must handle duplicates with idempotent processing.','What should a retry-safe consumer be?',['Idempotent','Stateful only','Synchronous'],0],['Consistency models','Understand when replicas can disagree.',['Primary','Replica A','Replica B'],'Strong consistency favors immediate visibility; eventual consistency permits temporary divergence for availability and scale.','What can eventual consistency expose?',['Stale reads','No network traffic','Perfect ordering'],0],['Rate limiting','Protect APIs from abusive or bursty traffic.',['Client','Token Bucket','API'],'Token buckets allow bursts while enforcing average limits. Distributed enforcement requires shared or coordinated counters.','Which algorithm allows controlled bursts?',['Token bucket','Bubble sort','DFS'],0],['Distributed locks','Coordinate concurrent updates to shared resources.',['Worker A','Lock','Worker B'],'Use leases, fencing tokens, and timeouts. A lock without failure handling can block progress indefinitely.','What protects against an expired lock holder?',['Fencing token','CSS selector','Cache hit'],0]],
ai:[['Embeddings and similarity','Represent semantic meaning as vectors.',['Text','Embedding','Vector Search'],'Embedding models map inputs into vectors. Cosine similarity can rank nearby meanings, but relevance needs evaluation.','What do embeddings represent?',['Vector features','SQL tables only','Browser cookies'],0],['RAG architecture','Ground model answers in retrieved documents.',['Question','Retriever','LLM + Context'],'A retrieval pipeline chunks documents, embeds them, retrieves relevant passages, and provides them as context to the model.','What does retrieval provide?',['Relevant context','GPU drivers','CSS styles'],0],['Evaluating RAG','Measure retrieval and answer quality separately.',['Dataset','Recall@k','Faithfulness'],'Track retrieval recall, groundedness, latency, and failure cases. A fluent answer is not proof of correctness.','What detects unsupported claims?',['Faithfulness checks','Token count only','Font size'],0],['Tool-using agents','Let models choose controlled external actions.',['Planner','Tool Schema','Verified Result'],'Tools need strict schemas, permissions, timeouts, and audit logs. Never trust model-generated tool arguments without validation.','What should guard tool calls?',['Validation and permissions','Prompt length','Random delays'],0],['Fine-tuning vs RAG','Choose between changing behavior and adding knowledge.',['Problem','RAG / Fine-tune','Evaluation'],'RAG is useful for changing factual knowledge; fine-tuning can improve specialized patterns or output behavior.','Which updates frequently changing facts?',['RAG','Only fine-tuning','Neither'],0],['Inference optimization','Reduce latency and cost per generated response.',['Prompt','Model','Tokens / Cache'],'Measure time to first token, throughput, batching, caching, and model size before optimizing.','What should be measured first?',['Latency baseline','Button color','File names'],0],['Model monitoring','Detect quality and distribution changes.',['Traffic','Metrics','Alerts'],'Track error rates, latency, cost, feedback, and drift with privacy-aware logs and representative evaluation sets.','What helps detect regressions?',['Evaluation trends','One demo','Larger logo'],0]],
software:[['API contracts','Define predictable communication between services.',['Client','OpenAPI','Service'],'Specify request schemas, response shapes, errors, pagination, and backward compatibility before implementation.','What prevents accidental breaking changes?',['Contract tests','More animations','Longer URLs'],0],['Database indexing','Speed up queries by choosing useful access paths.',['Query','B-tree Index','Rows'],'Indexes accelerate selective lookups but increase write and storage overhead. Inspect query plans before adding them.','What shows query execution strategy?',['EXPLAIN','console.log only','HTML'],0],['Authentication vs authorization','Separate identity from permissions.',['Login','Identity','Permission Check'],'Authentication establishes who a user is; authorization decides what that user can access. Enforce permissions server-side.','Where must authorization be enforced?',['Server','Only frontend','CSS'],0],['CI/CD pipelines','Automate checks before deployment.',['Commit','Tests','Deploy'],'A reliable pipeline runs lint, tests, build, and controlled releases. Rollbacks and secrets management are essential.','What should block a broken deployment?',['Failing tests','More commits','Larger images'],0],['Concurrency and races','Reason about simultaneous operations.',['Request A','Shared State','Request B'],'Transactions, optimistic locking, and idempotency help prevent lost updates and duplicate effects.','What helps avoid lost updates?',['Version checks','Faster CSS','Longer TTL'],0],['Observability','Understand system behavior from telemetry.',['Logs','Metrics','Traces'],'Logs explain events, metrics show trends, and traces connect work across services. Use correlation IDs.','What connects a request across services?',['Trace ID','Page title','Cache key only'],0],['Testing pyramid','Balance fast checks with end-to-end confidence.',['Unit','Integration','E2E'],'Unit tests isolate logic; integration tests verify boundaries; E2E tests validate key user flows.','Which tests are usually fastest?',['Unit tests','E2E tests','Manual tests'],0]],
interview:[['Design a URL shortener','Practice requirements and capacity planning.',['API','ID Generator','Storage'],'Clarify scale, read/write ratio, slug uniqueness, redirects, analytics, and availability before choosing storage.','What should you ask first?',['Requirements and scale','Framework preference','CSS theme'],0],['Explain a production incident','Structure a clear engineering story.',['Impact','Diagnosis','Prevention'],'Explain symptoms, metrics, root cause, mitigation, and prevention. Separate facts from assumptions.','What makes an incident answer strong?',['Measured impact','Blame','Vague confidence'],0],['Behavioral STAR answers','Tell evidence-based stories in interviews.',['Situation','Action','Result'],'Focus on your own technical decisions, tradeoffs, measurable outcomes, and what you learned.','What does STAR end with?',['Result','Repository','Runtime'],0],['SQL interview patterns','Recognize joins, grouping, and windows.',['Rows','JOIN / GROUP','Result'],'Practice aggregation, duplicate handling, window functions, and NULL semantics with concrete sample data.','Which SQL feature ranks within groups?',['Window function','WHERE only','INSERT'],0],['System design tradeoffs','Explain why one solution fits better.',['Constraint','Options','Tradeoff'],'Discuss reliability, latency, consistency, cost, and complexity. State assumptions and revisit bottlenecks.','What is better than naming tools?',['Explaining tradeoffs','More buzzwords','No assumptions'],0],['Backend debugging','Find causes systematically under pressure.',['Reproduce','Measure','Fix + Verify'],'Start with reproduction and observability, narrow the failing layer, test the hypothesis, then add regression coverage.','What should happen before a fix?',['Reproduce and isolate','Rewrite everything','Deploy immediately'],0],['Coding communication','Show reasoning while solving problems.',['Clarify','Approach','Test'],'State constraints, walk through an example, explain complexity, and test edge cases aloud.','What should follow implementation?',['Edge-case testing','Stop talking','Ignore complexity'],0]]
};
const KEY='visuallearn-career-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{state={}};state={name:'Atharva',start:'2026-11-14',dailyGoal:4,level:'Intermediate',interests:TRACKS.map(t=>t.id),done:{},saved:{},answers:{},generated:[],...state};let view='feed',filter='all',aiEngine=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),persist=()=>localStorage.setItem(KEY,JSON.stringify(state));
function localDay(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function dayIndex(){let a=new Date(state.start+'T12:00:00'),b=new Date(localDay()+'T12:00:00');return Math.max(0,Math.round((b-a)/86400000))}
function builtIn(){let d=dayIndex();return TRACKS.filter(t=>state.interests.includes(t.id)).map((t,i)=>{let arr=TOPICS[t.id],idx=(d+Math.floor(d/arr.length)+i)%arr.length,x=arr[idx];return {id:t.id+'-'+idx,track:t.id,title:x[0],summary:x[1],nodes:x[2],insight:x[3],quiz:{q:x[4],options:x[5],answer:x[6]},source:'curriculum'}})}
function allPosts(){let base=builtIn(),extra=state.generated.filter(p=>p.date===localDay());return [...extra,...base].filter(p=>filter==='all'||p.track===filter)}
function doneToday(){return Object.entries(state.done).filter(([k,v])=>v.date===localDay()).length}
function streak(){let days=new Set(Object.values(state.done).map(x=>x.date)),d=new Date(localDay()+'T12:00:00'),n=0;if(!days.has(localDay()))d.setDate(d.getDate()-1);while(days.has(localDay(d))){n++;d.setDate(d.getDate()-1)}return n}
function stats(){let count=Object.keys(state.done).length,goal=state.dailyGoal;return '<div class="stats"><div class="stat"><span class="muted">Today</span><strong>'+doneToday()+'/'+goal+'</strong></div><div class="stat"><span class="muted">XP</span><strong>'+count*40+'</strong></div><div class="stat"><span class="muted">Streak</span><strong>'+streak()+'d</strong></div></div>'}
function notify(s){$('toast').textContent=s;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2600)}
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));$('rail-stats').innerHTML=stats()+'<div class="bar" style="margin-top:14px"><span style="width:'+Math.min(100,doneToday()/state.dailyGoal*100)+'%"></span></div><p class="muted">'+doneToday()+' lessons finished today</p>';if(view==='feed')feed();else if(view==='paths')paths();else if(view==='saved')saved();else settings()}
function feed(){let posts=allPosts();$('app').innerHTML='<div class="feed"><div class="eyebrow">DAY '+(dayIndex()+1)+' · '+esc(localDay())+'</div><h1>Your daily learning feed</h1><p>Swipe through ideas worth knowing. Learn, test yourself, and build interview-ready intuition.</p>'+stats()+'<div class="tabs"><button class="tab '+(filter==='all'?'active':'')+'" data-filter="all">For You</button>'+TRACKS.map(t=>'<button class="tab '+(filter===t.id?'active':'')+'" data-filter="'+t.id+'">'+t.name+'</button>').join('')+'</div><div class="panel"><div class="row between"><div><div class="eyebrow">AI CONTENT STUDIO</div><h3>Generate a lesson for your feed</h3><span class="muted">Optional, runs on your device with WebGPU</span></div><button id="generate">Generate</button></div><label for="prompt">Topic or question</label><input id="prompt" maxlength="120" placeholder="e.g. Design a distributed rate limiter"><div class="row" style="margin-top:10px"><select id="gen-track" style="max-width:210px">'+TRACKS.map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('')+'</select><span class="muted" id="ai-status">No API key needed; initial model download can be large.</span></div></div><div id="posts">'+(posts.length?posts.map(postHtml).join(''):'<div class="panel empty">No lessons in this category today. Change your interests in Settings.</div>')+'</div></div>';document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let id=b.dataset.save;state.saved[id]=!state.saved[id];persist();render()});document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>answer(b.dataset.check,Number(b.dataset.choice)));document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>complete(b.dataset.complete));$('generate').onclick=generate}
function postHtml(p){let track=TRACKS.find(t=>t.id===p.track),a=state.answers[p.id],done=!!state.done[p.id],saved=!!state.saved[p.id];return '<article class="post" id="post-'+esc(p.id)+'"><div class="post-head"><div class="row between"><span class="chip" style="color:'+track.color+'">'+esc(track.name)+'</span><span class="muted">'+(p.source==='ai'?'AI generated · verify facts':'Curated daily curriculum')+' · 3 min</span></div><h2>'+esc(p.title)+'</h2><p>'+esc(p.summary)+'</p></div><div class="visual">'+p.nodes.map((n,i)=>'<div class="node">'+esc(n)+'</div>'+(i<p.nodes.length-1?'<span class="arrow">→</span>':'')).join('')+'</div><div class="post-body"><div class="callout">'+esc(p.insight)+'</div><div class="eyebrow">Quick knowledge check</div><h3>'+esc(p.quiz.q)+'</h3><div class="options">'+p.quiz.options.map((x,i)=>'<button class="option '+(a!==undefined&&i===p.quiz.answer?'good':a===i?'bad':'')+'" data-check="'+esc(p.id)+'" data-choice="'+i+'" '+(a!==undefined?'disabled':'')+'>'+esc(x)+'</button>').join('')+'</div>'+(a!==undefined?'<p class="muted">'+(a===p.quiz.answer?'Correct. Well done.':'Review the explanation, then try this concept again tomorrow.')+'</p>':'')+'<div class="row lesson-action"><button data-complete="'+esc(p.id)+'" '+(a===undefined||done?'disabled':'')+'>'+(done?'✓ Completed':a===undefined?'Answer to complete':'Complete · +40 XP')+'</button><button class="ghost" data-save="'+esc(p.id)+'">'+(saved?'◆ Saved':'◇ Save')+'</button></div></div></article>'}
function answer(id,choice){let p=allPosts().find(x=>x.id===id);if(!p||state.answers[id]!==undefined)return;state.answers[id]=choice;persist();render();document.getElementById('post-'+id)?.scrollIntoView({block:'center'})}
function complete(id){if(state.done[id]||state.answers[id]===undefined)return;state.done[id]={date:localDay(),correct:state.answers[id]===allPosts().find(x=>x.id===id)?.quiz.answer};persist();render();notify('Lesson completed · +40 XP')}
function paths(){$('app').innerHTML='<div class="eyebrow">Your curriculum</div><h1>Learning paths</h1><p>Four parallel tracks, seven core concepts each. The feed rotates lessons daily.</p><div class="card-grid">'+TRACKS.map(t=>'<div class="panel"><span class="chip" style="color:'+t.color+'">'+t.name+'</span><h2>'+TOPICS[t.id].length+' concepts</h2><p>'+TOPICS[t.id].map(x=>esc(x[0])).join(' · ')+'</p><button data-go="'+t.id+'">Open feed</button></div>').join('')+'</div>';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{filter=b.dataset.go;view='feed';render()})}
function saved(){let ids=Object.keys(state.saved).filter(k=>state.saved[k]),posts=[...state.generated,...TRACKS.flatMap(t=>TOPICS[t.id].map((x,i)=>({id:t.id+'-'+i,track:t.id,title:x[0],summary:x[1],nodes:x[2],insight:x[3],quiz:{q:x[4],options:x[5],answer:x[6]},source:'curriculum'})))].filter(x=>ids.includes(x.id));$('app').innerHTML='<div class="eyebrow">Your collection</div><h1>Saved lessons</h1>'+(posts.length?posts.map(p=>'<div class="panel"><span class="chip">'+esc(p.track)+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.insight)+'</p></div>').join(''):'<div class="panel">Save lessons from your feed to revisit them here.</div>')}
function settings(){$('app').innerHTML='<div class="eyebrow">Personalization</div><h1>Learning settings</h1><div class="panel"><label>Name</label><input id="name" value="'+esc(state.name)+'" maxlength="50"><label>Daily lesson goal</label><select id="goal">'+[1,2,3,4,5,6,8].map(n=>'<option '+(n===state.dailyGoal?'selected':'')+'>'+n+'</option>').join('')+'</select><label>Level</label><select id="level">'+['Beginner','Intermediate','Advanced'].map(x=>'<option '+(x===state.level?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Tracks</label>'+TRACKS.map(t=>'<label><input type="checkbox" data-interest="'+t.id+'" style="width:auto" '+(state.interests.includes(t.id)?'checked':'')+'> '+t.name+'</label>').join('')+'<div class="row" style="margin-top:20px"><button id="save-settings">Save preferences</button><button class="ghost" id="export">Export data</button><button class="ghost" id="reset">Reset all data</button></div></div><p class="muted">Progress stays in this browser. There is no account sync or hosted AI inference. AI-generated content may contain errors.</p>';$('save-settings').onclick=()=>{let interests=[...document.querySelectorAll('[data-interest]:checked')].map(x=>x.dataset.interest);if(!interests.length)return notify('Choose at least one track');state.name=$('name').value.trim()||'Learner';state.dailyGoal=Number($('goal').value);state.level=$('level').value;state.interests=interests;persist();render();notify('Preferences saved')};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='visuallearn-career-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('reset').onclick=()=>{if(confirm('Delete all learning progress and generated lessons?')){localStorage.removeItem(KEY);location.reload()}}}
async function generate(){let topic=$('prompt').value.trim(),track=$('gen-track').value;if(topic.length<3)return notify('Enter a topic first');let btn=$('generate'),status=$('ai-status');btn.disabled=true;try{if(!navigator.gpu)throw Error('WebGPU is unavailable. Try recent Chrome on a supported device.');status.textContent='Loading local AI model (first download may take several minutes)...';if(!aiEngine){let m=await import('https://esm.sh/@mlc-ai/web-llm@0.2.78');aiEngine=await m.CreateMLCEngine('Llama-3.2-1B-Instruct-q4f16_1-MLC',{initProgressCallback:x=>status.textContent=x.text})}status.textContent='Generating lesson...';let instruction='Create one accurate microlearning card about '+topic+' for an '+state.level+' software engineer. Return ONLY a JSON object with keys title,summary,nodes,insight,quiz. nodes must be an array of exactly 3 short diagram labels. quiz must be {q:string,options:array of exactly 3 short strings,answer:integer 0 to 2}. Keep insight under 80 words. No markdown.';let res=await aiEngine.chat.completions.create({messages:[{role:'user',content:instruction}],temperature:0.35,max_tokens:550}),raw=res.choices[0].message.content||'',obj=JSON.parse(raw.slice(raw.indexOf('{'),raw.lastIndexOf('}')+1));if(![obj.title,obj.summary,obj.insight,obj.quiz?.q].every(x=>typeof x==='string'&&x.length>0&&x.length<1000)||!Array.isArray(obj.nodes)||obj.nodes.length!==3||obj.nodes.some(x=>typeof x!=='string'||x.length>80)||!Array.isArray(obj.quiz.options)||obj.quiz.options.length!==3||obj.quiz.options.some(x=>typeof x!=='string'||x.length>200)||!Number.isInteger(obj.quiz.answer)||obj.quiz.answer<0||obj.quiz.answer>2)throw Error('Model returned an invalid lesson. Try again.');let p={...obj,id:'ai-'+Date.now(),track,source:'ai',date:localDay()};state.generated.unshift(p);state.generated=state.generated.slice(0,100);persist();filter='all';render();notify('AI lesson added to your feed')}catch(e){status.textContent='Could not generate: '+e.message}finally{btn.disabled=false}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();scrollTo(0,0)});persist();render();
</script></body></html>
