<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisualLearnAI | Video Learning</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e1a;color:#f0f5ff;font-family:Inter,system-ui,sans-serif}button{cursor:pointer;font:inherit}aside{position:fixed;left:0;top:0;padding:28px;width:240px}aside h2{font-size:22px}aside h2 span{color:#9ef2ce}aside p{color:#9aabc4;line-height:1.6}main{height:100dvh;display:grid;place-items:center}.reel{height:min(100dvh,900px);aspect-ratio:9/16;max-width:100vw;position:relative;background:#111b2c;border:1px solid #34425b;border-radius:20px;overflow:hidden}video,canvas{width:100%;height:100%;object-fit:contain}canvas{display:none}.head{position:absolute;top:0;left:0;right:0;padding:24px;background:linear-gradient(#060b19ee,transparent)}.tag{color:#9ef2ce;font-size:12px;letter-spacing:1.5px;font-weight:800}.head h1{font-size:24px;margin:10px 0}.bottom{position:absolute;bottom:0;left:0;right:0;padding:65px 20px 25px;background:linear-gradient(transparent,#070b17f5)}.bottom p{color:#c6d2e4;line-height:1.5;font-size:14px}.btn{background:#9ef2ce;border:0;border-radius:10px;padding:12px 16px;font-weight:800;color:#08221a}.secondary{background:#243650;color:white}.actions{position:absolute;right:12px;bottom:190px;display:grid;gap:12px}.actions button{background:#1b2d48de;border:1px solid #60718d;color:white;border-radius:50%;height:48px;width:48px;font-size:20px}.progress{position:absolute;bottom:0;width:100%;height:4px;background:#39465f}.progress span{display:block;height:100%;background:#9ef2ce;width:0}.quiz{position:absolute;inset:0;background:#0b1426fa;display:none;flex-direction:column;justify-content:center;padding:28px;gap:12px}.quiz button{border:1px solid #4b6381;background:#223451;color:white;padding:15px;border-radius:12px;text-align:left}.quiz .correct{background:#24634d}.quiz .wrong{background:#693e4a}.hint{font-size:12px;color:#8ea1bd}.filters{display:grid;gap:9px}.filters button{background:#1d2b42;border:0;border-radius:10px;color:#dce9fa;padding:10px;text-align:left}.filters button.active{background:#9ef2ce;color:#071d16}@media(max-width:850px){aside{display:none}.reel{height:100dvh;border:0;border-radius:0}} </style></head><body><aside><h2>◈ VisualLearn<span>AI</span></h2><p>Career learning, one video at a time.</p><div class="filters" id="filters"></div><p class="hint">Swipe vertically or press ↑ ↓ to navigate. Videos are published by the automated rendering workflow.</p><p class="hint" id="status"></p><p class="hint" id="stats"></p></aside><main><div class="reel" id="reel"><video id="video" playsinline preload="metadata"></video><canvas id="preview" width="540" height="960"></canvas><div class="head"><span class="tag" id="track"></span><h1 id="title"></h1><span class="hint" id="count"></span></div><div class="actions"><button id="up" title="Previous">↑</button><button id="down" title="Next">↓</button><button id="mute" title="Mute">♫</button><button id="save" title="Save">◇</button></div><div class="bottom"><span class="tag" id="format"></span><p id="summary"></p><button class="btn" id="play">▶ Play</button> <button class="btn secondary" id="quiz-button">Quick quiz</button></div><div class="progress"><span id="bar"></span></div><div class="quiz" id="quiz"><span class="tag">KNOWLEDGE CHECK</span><h2 id="question"></h2><div id="choices" style="display:grid;gap:10px"></div><p id="feedback"></p><button id="close">Back to video</button></div></div></main><script>
const $=x=>document.getElementById(x);let all=[],items=[],idx=0,filter='All',muted=false,timer=null,playing=false,start=0,spoken=-1;let state=JSON.parse(localStorage.getItem('visuallearn-video')||'{"saved":{},"watched":{}}');const saveState=()=>localStorage.setItem('visuallearn-video',JSON.stringify(state));function select(){items=all.filter(x=>filter==='All'||x.track===filter);idx=0;load()}function load(){clearInterval(timer);speechSynthesis.cancel();playing=false;let p=items[idx];if(!p)return;$('video').pause();$('video').removeAttribute('src');$('video').load();$('track').textContent=p.track;$('title').textContent=p.title;$('summary').textContent=p.summary;$('count').textContent=(idx+1)+' / '+items.length;$('save').textContent=state.saved[p.id]?'◆':'◇';$('quiz').style.display='none';$('bar').style.width='0%';$('play').textContent='▶ Play';if(p.video){$('video').style.display='block';$('preview').style.display='none';$('video').src=p.video;$('video').muted=muted;$('format').textContent='AI-NARRATED VIDEO'}else{$('video').style.display='none';$('preview').style.display='block';$('format').textContent='LIVE ANIMATED PREVIEW';draw(0)}}function draw(t){let p=items[idx],c=$('preview'),g=c.getContext('2d'),w=c.width;g.fillStyle='#0b1528';g.fillRect(0,0,w,960);let grad=g.createRadialGradient(270,340,10,270,340,440);grad.addColorStop(0,'#25465b');grad.addColorStop(1,'#0b1528');g.fillStyle=grad;g.fillRect(0,0,w,960);g.textAlign='center';g.fillStyle='#9ef2ce';g.font='bold 20px system-ui';g.fillText('VISUALLEARN AI',270,180);g.fillStyle='white';g.font='bold 29px system-ui';g.fillText(p.title.slice(0,30),270,255);p.nodes.forEach((n,i)=>{let y=350+i*130;g.fillStyle=i===Math.floor(t*1.3)%3?'#27675c':'#1a3049';g.strokeStyle='#80a7bb';g.lineWidth=2;g.beginPath();g.roundRect(65,y,410,86,16);g.fill();g.stroke();g.fillStyle='white';g.font='bold 25px system-ui';g.fillText(n,270,y+53);if(i<2){g.fillStyle='#9ef2ce';g.font='30px system-ui';g.fillText('↓',270,y+119)}});g.fillStyle='#dce9fa';g.font='21px system-ui';let words=p.narration.split(' '),line='',y=790;for(let word of words){let s=line?line+' '+word:word;if(g.measureText(s).width>460){g.fillText(line,270,y);y+=30;line=word}else line=s}if(line)g.fillText(line,270,y);g.fillStyle='#9ef2ce';g.fillRect(0,951,540*Math.min(1,t/22),7)}function play(){let p=items[idx];if(!p)return;if(p.video){let v=$('video');if(v.paused){v.play().then(()=>$('play').textContent='Ⅱ Pause').catch(()=>{})}else{v.pause();$('play').textContent='▶ Play'}return}if(playing){clearInterval(timer);speechSynthesis.cancel();playing=false;$('play').textContent='▶ Play';return}playing=true;start=performance.now();$('play').textContent='Ⅱ Pause';if(!muted){let u=new SpeechSynthesisUtterance(p.narration);u.rate=.92;speechSynthesis.speak(u)}timer=setInterval(()=>{let t=(performance.now()-start)/1000;draw(t);$('bar').style.width=Math.min(100,t/22*100)+'%';if(t>=22){clearInterval(timer);playing=false;mark();$('play').textContent='↻ Replay'}},80)}function mark(){let p=items[idx];state.watched[p.id]=new Date().toLocaleDateString('en-CA');saveState();$('stats').textContent=Object.keys(state.watched).length+' videos completed'}function move(n){if(!items.length)return;idx=(idx+n+items.length)%items.length;load()}$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);$('play').onclick=play;$('video').ontimeupdate=()=>{let v=$('video');if(v.duration)$('bar').style.width=(100*v.currentTime/v.duration)+'%'};$('video').onended=()=>{mark();move(1)};$('mute').onclick=()=>{muted=!muted;$('video').muted=muted;if(muted)speechSynthesis.cancel();$('mute').textContent=muted?'♪̸':'♫'};$('save').onclick=()=>{let p=items[idx];state.saved[p.id]=!state.saved[p.id];saveState();$('save').textContent=state.saved[p.id]?'◆':'◇'};$('quiz-button').onclick=()=>{let p=items[idx];$('video').pause();clearInterval(timer);speechSynthesis.cancel();$('quiz').style.display='flex';$('question').textContent=p.quiz.q;$('feedback').textContent='';$('choices').replaceChildren();p.quiz.options.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{for(let b of $('choices').children)b.disabled=true;b.classList.add(i===p.quiz.answer?'correct':'wrong');$('feedback').textContent=i===p.quiz.answer?'Correct!':'Correct answer: '+p.quiz.options[p.quiz.answer];if(i===p.quiz.answer)mark()};$('choices').append(b)})};$('close').onclick=()=>$('quiz').style.display='none';document.addEventListener('keydown',e=>{if(e.key==='ArrowDown')move(1);if(e.key==='ArrowUp')move(-1);if(e.key===' '){e.preventDefault();play()}});let touch=0;$('reel').addEventListener('touchstart',e=>touch=e.changedTouches[0].clientY,{passive:true});$('reel').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientY-touch;if(Math.abs(d)>60)move(d<0?1:-1)},{passive:true});fetch('./content/manifest.json?'+Date.now()).then(r=>r.json()).then(x=>{all=x.videos||[];if(!all.length)throw Error('empty');$('status').textContent=all.some(x=>x.video)?'Published MP4 videos ready':'Animated previews until video pipeline publishes MP4 files';$('filters').innerHTML=['All',...new Set(all.map(x=>x.track))].map(t=>'<button data-filter="'+t+'">'+t+'</button>').join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));select()});select();$('stats').textContent=Object.keys(state.watched).length+' videos completed'}).catch(e=>{$('status').textContent='Video manifest unavailable: '+e.message});
</script></body></html>
